name: CI Pipeline

on:
  push:
    branches:
      - "**"

jobs:
  ci:
    name: Install and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start app
        run: |
          node src/server.js &
          sleep 3
          curl http://localhost:3000/health